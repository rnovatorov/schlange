[project]
name = "schlange-queue"
version = "0.2.0"
description = "Lightweight, persistent, single-node task queue with at-least-once delivery guarantee"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Roman Novatorov", email = "roman.novatorov@gmail.com" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/rnovatorov/schlange"

[dependency-groups]
dev = ["black", "isort", "mypy", "pyflakes"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "schlange"

[tool.black]
target-version = ["py311"]
